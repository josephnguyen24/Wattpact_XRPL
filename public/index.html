<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WattPact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="band">
  <div class="wrap nav">
    <a class="brand" href="#operateur">
      <svg viewBox="0 0 24 24" class="bolt" aria-hidden="true"><path d="M13.5 2 5 13.2h6l-1.5 8.8L19 10.6h-6.2L13.5 2Z"/></svg>
      <span>WattPact</span>
    </a>
    <nav class="roles" id="roles">
      <a href="#operateur">Opérateur</a>
      <a href="#verificateur">Vérificateur</a>
      <a href="#foyer1">Foyer 1</a>
      <a href="#foyer2">Foyer 2</a>
      <a href="#foyer3">Foyer 3</a>
    </nav>
    <div class="net" id="net"><span class="led"></span><span id="net-label">connexion…</span>
      <span class="ledger" id="ledger" title="Dernier ledger validé, lu en direct sur le Testnet">ledger <b id="ledger-n">…</b></span></div>
  </div>

  <div class="wrap hero">
    <div class="hero-text">
      <p class="kicker">XRPL Testnet · effacement de pointe</p>
      <p class="claim">La prime est bloquée<br><em>avant</em> l'effort.</p>
    </div>
    <svg class="curve" viewBox="0 0 600 150" aria-hidden="true">
      <defs>
        <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c6ff3d" stop-opacity=".28"/>
          <stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect class="peak" x="420" y="0" width="70" height="150"/>
      <text class="peak-label" x="455" y="16">18h-20h</text>
      <path class="area" d="M0 120 C60 118 90 95 140 92 S220 105 270 100 S350 80 400 60 S440 18 455 20 S480 40 500 75 S560 110 600 112 L600 150 L0 150 Z"/>
      <path id="load" class="line" d="M0 120 C60 118 90 95 140 92 S220 105 270 100 S350 80 400 60 S440 18 455 20 S480 40 500 75 S560 110 600 112"/>
      <path class="line cut" d="M420 44 C435 52 445 56 455 58 S475 60 490 64"/>
      <circle class="spark" r="4.5">
        <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#load"/></animateMotion>
      </circle>
    </svg>
    <dl class="stats">
      <div><dt>sous séquestre</dt><dd id="st-locked">0</dd></div>
      <div><dt>primes payées</dt><dd id="st-paid">0</dd></div>
      <div><dt>remboursées</dt><dd id="st-refunded">0</dd></div>
    </dl>
  </div>
</header>

<main class="wrap" id="view"></main>

<div class="glow" id="glow" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/vendor/xrpl-latest-min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
